<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 70" width="100%" height="100%">
  <defs>
    <linearGradient id="thuj_ft_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A11"/>
      <stop offset="50%" stop-color="#0B101D"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <!-- Top Border Line Gradient -->
    <linearGradient id="thuj_ft_line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="25%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <!-- Traveling Glow Node -->
    <radialGradient id="thuj_ft_pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="1"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <filter id="thuj_ft_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .ft-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .ft-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="850" height="70" rx="10" fill="url(#thuj_ft_bg)"/>
  <rect width="848" height="68" x="1" y="1" rx="9" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Top Accent Beam -->
  <line x1="40" y1="2" x2="810" y2="2" stroke="url(#thuj_ft_line)" stroke-width="2"/>

  <!-- Animated Floating Pulse Point along the top beam -->
  <g>
    <circle cx="425" cy="2" r="5" fill="url(#thuj_ft_pulse)" filter="url(#thuj_ft_glow)">
      <animate attributeName="cx" values="100;750;100" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425" cy="2" r="2" fill="#FFFFFF">
      <animate attributeName="cx" values="100;750;100" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left Technical Indicator -->
  <g transform="translate(35, 38)">
    <circle cx="0" cy="0" r="3" fill="#00F2FE" opacity="0.8"/>
    <text x="12" y="3.5" fill="#64748B" font-size="10" class="ft-mono" letter-spacing="1.2">SYSTEM // VERIFIED</text>
  </g>

  <!-- Center Main Brand Text -->
  <g transform="translate(425, 33)">
    <text x="0" y="0" fill="#E2E8F0" font-size="11.5" font-weight="600" class="ft-sans" text-anchor="middle" letter-spacing="0.5">
      CRAFTED WITH PRECISION &amp; CODE <tspan fill="#38BDF8">•</tspan> MOHANATHAS THUJEEBAN
    </text>
    <text x="0" y="17" fill="#64748B" font-size="9.5" class="ft-mono" text-anchor="middle" letter-spacing="1">
      COLOMBO, SRI LANKA // BIT &amp; NDT • UNIVERSITY OF MORATUWA
    </text>
  </g>

  <!-- Right Technical Coordinate -->
  <g transform="translate(815, 38)">
    <text x="0" y="3.5" fill="#38BDF8" font-size="10" class="ft-mono" text-anchor="end" letter-spacing="1">v2.4.0 [STABLE]</text>
  </g>

</svg>
